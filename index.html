<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="拼音岛">
  <meta name="theme-color" content="#1391AE">
  <!-- The child launches this from the iPad home screen, so it needs a real
       icon rather than a screenshot. tools/gen_icon.py draws it. -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <title>拼音岛</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── 开始 ─────────────────────────────────────────────────────── -->
  <section id="start-screen" class="screen">
    <div class="screen-content" style="padding-top:12vh;">
      <div class="card animate-fade-up" style="text-align:center;">
        <div class="stave stave-4" style="height:132px; display:flex; align-items:center; justify-content:center; margin-bottom:22px;">
          <span style="font-family:var(--font-pinyin); font-size:2.9rem; color:var(--ink); transform:translateY(8px);">
            p<span class="t1">ī</span>n y<span class="t1">ī</span>n
          </span>
        </div>
        <h1 style="font-size:2rem; margin-bottom:6px;">拼音岛</h1>
        <p style="color:var(--ink-light); font-size:0.9rem; margin-bottom:24px;">
          一课一课，跟着课本学拼音
        </p>
        <input id="name-input" class="btn btn-secondary btn-full" type="text"
               placeholder="你叫什么名字？" maxlength="12" autocomplete="off"
               style="text-align:center; margin-bottom:14px; font-weight:600;">
        <button class="btn btn-primary btn-full" onclick="handleStart()">开始 →</button>
      </div>
    </div>
  </section>

  <!-- ── 首页 ─────────────────────────────────────────────────────── -->
  <section id="home-screen" class="screen hidden">
    <div class="screen-header">
      <div class="screen-header-inner">
        <div>
          <div class="header-title">你好，<span id="home-name">小朋友</span></div>
          <div class="header-subtitle" id="home-date">—</div>
        </div>
        <div style="text-align:right;">
          <div id="home-streak" style="font-size:1rem; font-weight:700;">🔥 <span id="home-streak-n">0</span></div>
          <div class="header-subtitle">⭐ <span id="home-points">0</span></div>
        </div>
      </div>
    </div>

    <div class="screen-content">
      <div class="card" id="home-mission-card" style="text-align:center;">
        <div class="section-label">今天的任务</div>
        <div id="home-lesson-title" style="font-size:1.6rem; font-weight:700; margin:8px 0 4px;">—</div>
        <div id="home-lesson-sub" style="font-size:0.85rem; color:var(--ink-light); margin-bottom:18px;">—</div>
        <button class="btn btn-primary btn-full" id="home-play-btn" onclick="startMission()">
          ▶ 开始，5 分钟
        </button>
        <div id="home-done-msg" class="hidden" style="margin-top:12px; font-size:0.85rem; color:var(--ink-light);">
          今天的任务做完啦！再来一次也可以。
        </div>
      </div>

      <div class="card" onclick="navTo('lesson-screen')" style="cursor:pointer;">
        <div class="section-label">这一课学什么</div>
        <div id="home-lesson-sounds" class="sounds-grid" style="grid-template-columns:repeat(auto-fill,minmax(78px,1fr));"></div>
      </div>

      <div class="card">
        <div class="section-label">这一周</div>
        <div id="home-week" style="display:flex; justify-content:space-between; gap:6px;"></div>
      </div>
    </div>
  </section>

  <!-- ── 拼音王国 ─────────────────────────────────────────────────── -->
  <section id="map-screen" class="screen hidden">
    <div class="screen-header">
      <div class="screen-header-inner">
        <div>
          <div class="header-title">拼音王国</div>
          <div class="header-subtitle">14 座小岛，一课一座</div>
        </div>
        <div class="header-subtitle"><span id="map-done">0</span> / 14</div>
      </div>
    </div>
    <div class="screen-content" id="map-content"></div>
  </section>

  <!-- ── 一课的详情 ───────────────────────────────────────────────── -->
  <section id="lesson-screen" class="screen hidden">
    <div class="screen-header">
      <div class="screen-header-inner">
        <button class="btn btn-secondary" style="padding:8px 14px; min-height:0; font-size:0.85rem;"
                onclick="navTo('map-screen')">← 王国</button>
        <div class="header-title" id="lesson-header-title" style="font-size:1.1rem;"></div>
      </div>
    </div>
    <div class="screen-content" id="lesson-content"></div>
  </section>

  <!-- ── 做任务 ───────────────────────────────────────────────────── -->
  <section id="game-screen" class="screen hidden">
    <div style="max-width:560px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 18px 4px;">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:6px;">
        <button class="btn btn-secondary" style="padding:6px 12px; min-height:0; font-size:0.8rem;"
                onclick="quitMission()">✕</button>
        <div style="flex:1; height:12px; border-radius:999px; background:var(--paper-edge); overflow:hidden;">
          <div id="mission-progress-fill" style="height:100%; width:0%; background:var(--sea); border-radius:999px; transition:width 0.3s;"></div>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:0.78rem; color:var(--ink-light);">
        <span id="mission-progress-label">1 / 10</span>
        <span id="mission-score">0 分</span>
      </div>
    </div>
    <div class="screen-content" id="game-area" style="padding-top:14px;"></div>
  </section>

  <!-- ── 做完了 ───────────────────────────────────────────────────── -->
  <section id="result-screen" class="screen hidden">
    <div class="screen-content" style="padding-top:8vh;">
      <div class="card" style="text-align:center;">
        <div id="result-emoji" style="font-size:3.4rem; margin-bottom:6px;">🎉</div>
        <div class="section-label">今天的成绩</div>
        <div id="result-score" style="font-size:3rem; font-weight:700; margin:6px 0;">0</div>
        <div id="result-correct" style="font-size:0.95rem; color:var(--ink-light); margin-bottom:6px;">0 / 10</div>
        <div id="result-streak" style="font-size:0.9rem; margin-bottom:18px;"></div>
        <div id="result-stickers"></div>
        <div id="result-unlock" class="hidden" style="margin:16px 0; padding:14px; border-radius:16px; background:var(--sea-pale);"></div>
        <button class="btn btn-primary btn-full" onclick="navTo('home-screen')" style="margin-top:12px;">
          回家
        </button>
      </div>
    </div>
  </section>

  <!-- ── 贴纸册 ───────────────────────────────────────────────────── -->
  <section id="sticker-screen" class="screen hidden">
    <div class="screen-header">
      <div class="screen-header-inner">
        <div>
          <div class="header-title">贴纸册</div>
          <div class="header-subtitle">攒满 40 张</div>
        </div>
        <div class="header-subtitle"><span id="sticker-count">0</span> / 40</div>
      </div>
    </div>
    <div class="screen-content" id="sticker-content"></div>
  </section>

  <!-- ── 家长 ─────────────────────────────────────────────────────── -->
  <section id="word-list-screen" class="screen hidden">
    <div class="screen-header">
      <div class="screen-header-inner">
        <div>
          <div class="header-title">词语</div>
          <div class="header-subtitle">学完一课，开一组新词</div>
        </div>
        <div class="header-subtitle">学过 <span id="word-studied-count">0</span></div>
      </div>
    </div>
    <div class="screen-content" id="word-list-content"></div>
  </section>

  <section id="word-theme-screen" class="screen hidden">
    <div class="screen-header">
      <div class="screen-header-inner">
        <button class="btn btn-small" onclick="navTo('word-list-screen')">← 词语</button>
        <div class="header-title" id="word-theme-title">—</div>
      </div>
    </div>
    <div class="screen-content" id="word-theme-content"></div>
  </section>

  <section id="story-list-screen" class="screen hidden">
    <div class="screen-header">
      <div class="screen-header-inner">
        <div>
          <div class="header-title">故事</div>
          <div class="header-subtitle">读一读，听一听</div>
        </div>
        <div class="header-subtitle"><span id="story-read-count">0</span> / <span id="story-total">0</span></div>
      </div>
    </div>
    <div class="screen-content" id="story-list-content"></div>
  </section>

  <section id="story-screen" class="screen hidden">
    <div class="screen-header">
      <div class="screen-header-inner">
        <button class="btn btn-small" onclick="navTo('story-list-screen')">← 故事</button>
        <div class="header-title" id="story-title">—</div>
      </div>
    </div>
    <div class="screen-content" id="story-content"></div>
  </section>

  <section id="parent-screen" class="screen hidden">
    <div class="screen-header">
      <div class="screen-header-inner">
        <div>
          <div class="header-title">家长</div>
          <div class="header-subtitle">进度与设置</div>
        </div>
      </div>
    </div>
    <div class="screen-content" id="parent-content"></div>
  </section>

  <!-- ── 音频检查 ─────────────────────────────────────────────────── -->
  <section id="audio-check-screen" class="screen hidden">
    <div class="screen-header">
      <div class="screen-header-inner">
        <button class="btn btn-secondary" style="padding:8px 14px; min-height:0; font-size:0.85rem;"
                onclick="navTo('parent-screen')">← 返回</button>
        <div class="header-title" style="font-size:1.05rem;">音频检查</div>
      </div>
    </div>
    <div class="screen-content">
      <p style="color:var(--ink-mid); font-size:0.86rem; line-height:1.7; margin-bottom:18px;">
        逐个播放，读得对就点 ✓，不对就点 ✗。标记为 ✗ 的会列在最下面，
        自己录一段存到 <code>audio/overrides/</code> 里就会自动替换。
      </p>
      <div id="check-list"></div>
      <div id="check-summary" class="card hidden" style="margin-top:18px;"></div>
    </div>
  </section>

  <!-- ── 底部导航 ─────────────────────────────────────────────────── -->
  <nav id="bottom-nav" class="hidden">
    <button class="nav-btn active" data-screen="home-screen" onclick="navTo('home-screen', this)">
      <span class="nav-icon">🏠</span><span class="nav-label">首页</span>
    </button>
    <button class="nav-btn" data-screen="map-screen" onclick="navTo('map-screen', this)">
      <span class="nav-icon">🗺</span><span class="nav-label">王国</span>
    </button>
    <button class="nav-btn" data-screen="word-list-screen" onclick="navTo('word-list-screen', this)">
      <span class="nav-icon">🗂</span><span class="nav-label">词语</span>
    </button>
    <button class="nav-btn" data-screen="story-list-screen" onclick="navTo('story-list-screen', this)">
      <span class="nav-icon">📚</span><span class="nav-label">故事</span>
    </button>
    <button class="nav-btn" data-screen="sticker-screen" onclick="navTo('sticker-screen', this)">
      <span class="nav-icon">🌟</span><span class="nav-label">贴纸册</span>
    </button>
    <button class="nav-btn" data-screen="parent-screen" onclick="navTo('parent-screen', this)">
      <span class="nav-icon">👨‍👩‍👧</span><span class="nav-label">家长</span>
    </button>
  </nav>

  <div id="toast" class="toast"></div>

  <!-- ── Scripts, in dependency order ─────────────────────────────── -->
  <script src="lib/storage.js"></script>
  <script src="lib/ruby.js"></script>
  <script src="lib/audio.js"></script>
  <script src="lib/sfx.js"></script>
  <script src="data/sounds.js"></script>
  <script src="data/syllables.js"></script>
  <script src="data/stickers.js"></script>
  <script src="data/stories.js"></script>
  <script src="data/words.js"></script>
  <script src="lib/strength.js"></script>
  <script src="lib/scoring.js"></script>
  <script src="lib/streaks.js"></script>
  <script src="data/lessons/_registry.js"></script>
  <script src="data/lessons/lessons.js"></script>
  <script src="lib/selection.js"></script>
  <script src="lib/progress.js"></script>
  <script src="lib/stickers.js"></script>
  <script src="lib/stories.js"></script>
  <script src="lib/words.js"></script>
  <script src="games/_ui.js"></script>
  <script src="games/listenPick.js"></script>
  <script src="games/toneTrain.js"></script>
  <script src="games/blendBuilder.js"></script>
  <script src="games/sharpEyes.js"></script>
  <script src="games/readPick.js"></script>
  <script src="games/dailyMission.js"></script>
  <script src="app.js"></script>

  <!--
    Offline. The app makes no network calls of its own, so once the service
    worker has the files the child can use it on a plane. Skipped on file://,
    where service workers are unavailable and opening index.html directly is
    still the dev loop.
  -->
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      // Was the page already being served by a worker when it loaded? If so, a
      // worker taking over later is an *update*, and the page should pick it
      // up. On a first visit there is no previous worker and the handover is
      // just the install finishing — reloading then would be a pointless flash.
      var hadController = !!navigator.serviceWorker.controller;
      var reloading = false;

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || reloading) return;
        reloading = true;
        location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // Home-screen apps can sit for days without a navigation, which is
          // when a browser would normally look. Ask on every open.
          reg.update();
        }).catch(function () {
          /* Offline support is a bonus; never let it break the app. */
        });
      });
    }
  </script>
</body>
</html>
